[project]
name = "mts-fiscal-intelligence"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.14.3",
    "httpx>=0.28.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "openai>=2.52.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.28.0",
    "rich>=15.0.0",
    "sentence-transformers>=5.6.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.1",
]

[build-system]
requires = ["uv_build >= 0.12.0, <0.13.0"]
build-backend = "uv_build"
